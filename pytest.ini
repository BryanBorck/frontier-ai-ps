[pytest]
# Test discovery patterns
testpaths = tests src/tools src/agent
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for organizing tests
markers =
    unit: Fast unit tests with mocked/minimal data (< 100ms)
    integration: Integration tests using real DB snapshots
    e2e: End-to-end tests with complete workflows
    slow: Tests that take > 1 second
    requires_db: Tests that require real database files
    requires_llm: Tests that make actual LLM calls (expensive)

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --color=yes

# Ignore these directories during test collection
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .venv
    venv
    node_modules

# Minimum version
minversion = 7.0

# Logging
log_cli = false
log_cli_level = INFO

# Disable some warnings for cleaner output
filterwarnings =
    ignore::DeprecationWarning
