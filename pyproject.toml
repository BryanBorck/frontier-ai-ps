[project]
name = "frontier-ai-ps"
version = "0.1.0"
description = "Toolkit for fund finding"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dspy>=3.0.4",
    "duckdb>=1.4.2",
    "exa-py>=1.0.0",
    "mlflow>=2.18.0",
    "pandas>=2.3.3",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "sentence-transformers>=5.1.2",
    "typer>=0.20.0",
]

[project.scripts]
dspy-agent = "src.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.14.5",
]
